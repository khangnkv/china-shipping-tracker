<!doctype html>
<html lang="en"{% if theme_attr %} data-theme="{{ theme_attr }}"{% endif %}>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }} — SINEX</title>
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
{% from "_macros.html" import icon with context %}
<body class="min-h-screen">

<div class="px-4 pb-5 pt-6 shadow-sm" style="background: var(--bg-card);">
  <div class="mx-auto max-w-md">
    <a href="{{ url_for('landing') }}" class="flex items-center gap-2">
      <span class="flex h-8 w-8 items-center justify-center rounded-lg" style="background: var(--brand);">
        <svg width="16" height="16" viewBox="0 0 40 40" fill="none" aria-hidden="true"><ellipse cx="20" cy="20" rx="18" ry="7" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-dasharray="3 2.4" transform="rotate(-18 20 20)" opacity="0.85"/><circle cx="20" cy="20" r="12.5" fill="#ffffff"/></svg>
      </span>
      <span class="text-sm font-semibold">SINEX</span>
    </a>
  </div>
</div>

<div class="mx-auto flex max-w-md flex-col items-center px-4 py-12 text-center">
  <div class="mb-3 flex justify-center" style="color: var(--text-faint2);">{{ icon('alert-circle', 'h-10 w-10') }}</div>
  <h1 class="text-lg font-bold">{{ title }}</h1>
  <p class="mt-1.5 text-sm" style="color: var(--text-muted);">{{ body }}</p>

  <div class="mt-6 flex w-full flex-col gap-2.5">
    <button type="button" onclick="history.back()" class="btn-primary w-full justify-center">{{ t('error.go_back') }}</button>
    <a href="{{ url_for('landing') }}" class="btn w-full justify-center">{{ t('track.not_found_home') }}</a>
    {% if LINE_CONTACT %}
    <a href="https://line.me/ti/p/~{{ LINE_CONTACT.lstrip('@') }}" target="_blank" rel="noopener noreferrer"
       class="flex w-full items-center justify-center gap-2 rounded-lg bg-[#06C755] px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-[#05b04c] active:scale-[0.98]">
      {{ icon('message-circle', 'h-4 w-4') }} {{ t('request.line_cta') }}
    </a>
    {% endif %}
  </div>
</div>

</body>
</html>
