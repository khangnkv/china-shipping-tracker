<!doctype html>
<html lang="en"{% if theme_attr %} data-theme="{{ theme_attr }}"{% endif %}>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin login — SINEX</title>
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
{% from "_macros.html" import icon, theme_switch with context %}
<body class="min-h-screen" style="background: linear-gradient(180deg, var(--brand-tint-bg) 0%, var(--bg-page) 55%);">
<div class="absolute right-4 top-4">{{ theme_switch() }}</div>
<div class="flex min-h-screen items-center justify-center px-4">
  <div class="w-full max-w-sm">
    <div class="mb-8 text-center">
      <div class="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-2xl shadow-lg" style="background: var(--brand); box-shadow: 0 10px 24px -8px var(--brand-shadow);">
        <svg width="32" height="32" viewBox="0 0 40 40" fill="none" aria-hidden="true"><ellipse cx="20" cy="20" rx="18" ry="7" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-dasharray="3 2.4" transform="rotate(-18 20 20)" opacity="0.85"/><circle cx="20" cy="20" r="12.5" fill="#ffffff"/></svg>
      </div>
      <h1 class="text-2xl font-bold tracking-tight">SINEX</h1>
      <p class="mt-1 text-sm" style="color: var(--text-muted);">Sign in to manage your orders</p>
    </div>

    <form method="post" class="card p-6 shadow-sm">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          {% for m in messages %}
          <div class="mb-4 rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700">{{ m }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <label class="label" for="pw">Password</label>
      <div class="relative">
        <input id="pw" type="password" name="password" required autocomplete="current-password"
               class="input pr-10" placeholder="••••••••">
        <button type="button" id="pwToggle" onclick="togglePw()" aria-label="Show password" aria-pressed="false"
                class="absolute right-3 top-1/2 -translate-y-1/2 transition" style="color: var(--text-faint);">
          <span id="eye">{{ icon('eye') }}</span><span id="eyeoff" class="hidden">{{ icon('eye-off') }}</span>
        </button>
      </div>

      <button type="submit" class="btn-primary mt-6 w-full justify-center">Sign in</button>
    </form>
  </div>
</div>
<script>
  function togglePw() {
    const pw = document.getElementById('pw');
    const btn = document.getElementById('pwToggle');
    const showing = pw.type === 'text';
    pw.type = showing ? 'password' : 'text';
    document.getElementById('eye').classList.toggle('hidden', !showing);
    document.getElementById('eyeoff').classList.toggle('hidden', showing);
    btn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
    btn.setAttribute('aria-pressed', String(!showing));
  }
</script>
<script src="{{ url_for('static', filename='interactive.js') }}" defer></script>
</body>
</html>
